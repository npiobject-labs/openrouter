[package]
name = "openrouter-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tower-http = { version = "0.6", features = ["cors"] }
# "bundled" compila SQLite con el binario: el runtime no necesita libsqlite3.
rusqlite = { version = "0.40", features = ["bundled"] }
# Solo para guardar el hash de las claves de aplicacion, nunca la clave.
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
