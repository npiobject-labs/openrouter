name: Desplegar backend en Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  desplegar:
    name: Construir y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Variable de repositorio opcional; si existe, manda sobre el nombre derivado.
      FLY_APP_VAR: ${{ vars.FLY_APP }}
    steps:
      # Fly es opcional: sin secreto el workflow termina en verde con un aviso.
      - name: Comprobar si Fly esta configurado
        id: fly
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly" >> "$GITHUB_STEP_SUMMARY"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
            echo "Token presente (valor oculto)."
          fi

      # Nombre de la app: variable FLY_APP si existe; si no, <repo>-<owner> en
      # minusculas, saneado a [a-z0-9-] y recortado a 30 caracteres.
      - name: Determinar el nombre de la app
        id: app
        if: steps.fly.outputs.configurado == 'true'
        run: |
          if [ -n "${FLY_APP_VAR}" ]; then
            app="${FLY_APP_VAR}"
            origen="variable de repositorio FLY_APP"
          else
            nombre="${GITHUB_REPOSITORY#*/}"
            owner="${GITHUB_REPOSITORY%%/*}"
            app="$(printf '%s-%s' "${nombre}" "${owner}" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -c 'a-z0-9-' '-' \
              | cut -c1-30 \
              | sed 's/-*$//')"
            origen="derivado de ${GITHUB_REPOSITORY}"
          fi
          if [ -z "${app}" ]; then
            echo "::error::No se pudo determinar el nombre de la app de Fly."
            exit 1
          fi
          echo "App de Fly: ${app} (${origen})"
          echo "app=${app}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.fly.outputs.configurado == 'true'
        uses: actions/checkout@v5

      - name: Instalar flyctl
        if: steps.fly.outputs.configurado == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Crear la app si no existe
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl apps create "${FLY_APP}" --org desdemovil || true

      # BUILD_ID y, si existen, los secretos del servicio. --stage los deja
      # preparados sin reiniciar: los aplica el deploy siguiente.
      - name: Fijar los secretos del servicio
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERVICIO_CLAVE: ${{ secrets.SERVICIO_CLAVE }}
          MODELO_DEFECTO: ${{ vars.MODELO_DEFECTO }}
        run: |
          set -- "BUILD_ID=${GITHUB_SHA}"
          if [ -n "${OPENROUTER_API_KEY}" ]; then
            set -- "$@" "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
          else
            echo "Sin OPENROUTER_API_KEY: /v1 respondera 503 hasta que se defina."
          fi
          if [ -n "${SERVICIO_CLAVE}" ]; then
            set -- "$@" "SERVICIO_CLAVE=${SERVICIO_CLAVE}"
          else
            echo "Sin SERVICIO_CLAVE: /v1 queda cerrado, que es lo correcto para un proxy publico."
          fi
          if [ -n "${MODELO_DEFECTO}" ]; then
            set -- "$@" "MODELO_DEFECTO=${MODELO_DEFECTO}"
          fi
          echo "Fijando $# secretos (valores ocultos)."
          flyctl secrets set "$@" --app "${FLY_APP}" --stage

      - name: Crear el volumen del historico si no existe
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          # "volumes create" no es idempotente: sin esta comprobacion cada
          # despliegue dejaria un volumen suelto mas.
          region="$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' app/fly.toml)"
          if flyctl volumes list --app "${FLY_APP}" --json | jq -e '.[] | select(.name == "datos")' > /dev/null; then
            echo "El volumen datos ya existe."
          else
            flyctl volumes create datos --app "${FLY_APP}" --region "${region}" --size 1 --yes
            echo "Volumen datos creado en ${region}."
          fi

      - name: Desplegar en Fly.io
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl deploy app --app "${FLY_APP}" --remote-only --ha=false

      - name: Verificar /salud
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SHA: ${{ github.sha }}
        run: |
          url="https://${FLY_APP}.fly.dev/salud"
          echo "Verificando ${url} (se espera build=${SHA})"
          for intento in $(seq 1 10); do
            respuesta="$(curl -fsS --max-time 20 "${url}" || true)"
            echo "Intento ${intento}/10: ${respuesta:-<sin respuesta>}"
            if printf '%s' "${respuesta}" | grep -q "${SHA}"; then
              echo "OK: /salud responde con el build ${SHA}"
              exit 0
            fi
            if [ "${intento}" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "::error::/salud no devolvio el SHA ${SHA} tras 10 intentos (150 s)."
          exit 1

      # Lo que consume docs/holamundo.html desde Pages: cuerpo exacto y CORS.
      - name: Verificar /holamundo
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          url="https://${FLY_APP}.fly.dev/holamundo"
          cabeceras="$(curl -fsS --max-time 20 -D - -o /tmp/cuerpo "${url}")"
          cuerpo="$(cat /tmp/cuerpo)"
          echo "Respuesta: ${cuerpo}"
          [ "${cuerpo}" = "holamundo" ] || { echo "::error::/holamundo devolvio '${cuerpo}'"; exit 1; }
          printf '%s' "${cabeceras}" | grep -qi '^access-control-allow-origin: \*' \
            || { echo "::error::/holamundo sin cabecera CORS"; exit 1; }
          echo "OK: /holamundo responde 'holamundo' con CORS"

      # La conexion real con OpenRouter. No gasta credito: solo consulta la clave.
      - name: Verificar /v1/estado
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERVICIO_CLAVE: ${{ secrets.SERVICIO_CLAVE }}
        run: |
          if [ -z "${SERVICIO_CLAVE}" ] || [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Secretos del servicio incompletos: no se comprueba /v1/estado."
            echo "Secretos del servicio incompletos: /v1/estado sin comprobar" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url="https://${FLY_APP}.fly.dev/v1/estado"
          echo "Verificando ${url}"
          for intento in $(seq 1 6); do
            # -o para no volcar el cuerpo: lleva la etiqueta y el saldo de la cuenta.
            codigo="$(curl -s -o /tmp/estado -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer ${SERVICIO_CLAVE}" "${url}" || true)"
            echo "Intento ${intento}/6: HTTP ${codigo}"
            if [ "${codigo}" = "200" ] && grep -q '"ok":true' /tmp/estado; then
              echo "OK: el servicio habla con OpenRouter"
              # El historico tiene que estar en el volumen. Si dice "memoria",
              # el montaje de /datos fallo y cada reinicio borraria el uso.
              almacen="$(jq -r '.almacen' /tmp/estado)"
              if [ "${almacen}" != "sqlite" ]; then
                echo "::error::el historico esta en '${almacen}', no en el volumen: revisa el montaje de /datos."
                exit 1
              fi
              echo "OK: historico en sqlite con $(jq -r '.registros' /tmp/estado) registros"
              exit 0
            fi
            if [ "${intento}" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "::error::/v1/estado no confirmo la conexion con OpenRouter (ultimo HTTP ${codigo})."
          exit 1

      # El catalogo: confirma que la ruta responde y trae modelos de verdad.
      - name: Verificar /v1/models
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERVICIO_CLAVE: ${{ secrets.SERVICIO_CLAVE }}
        run: |
          if [ -z "${SERVICIO_CLAVE}" ] || [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Secretos del servicio incompletos: no se comprueba /v1/models."
            exit 0
          fi
          url="https://${FLY_APP}.fly.dev/v1/models"
          codigo="$(curl -s -o /tmp/modelos -w '%{http_code}' --max-time 40 \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" "${url}" || true)"
          echo "HTTP ${codigo}"
          if [ "${codigo}" != "200" ]; then
            echo "::error::/v1/models respondio ${codigo}."
            exit 1
          fi
          # Solo el recuento: el catalogo entero son cientos de lineas.
          python3 -c "import json,sys; d=json.load(open('/tmp/modelos')); n=len(d.get('data',[])); print('Catalogo:', n, 'modelos, total', d.get('total')); sys.exit(0 if n else 1)" \
            || { echo "::error::el catalogo vino vacio o ilegible"; exit 1; }
          echo "OK: el catalogo trae modelos"

      - name: Verificar /v1/uso
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERVICIO_CLAVE: ${{ secrets.SERVICIO_CLAVE }}
        run: |
          if [ -z "${SERVICIO_CLAVE}" ] || [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Secretos del servicio incompletos: no se comprueba /v1/uso."
            exit 0
          fi
          # El registro esta vacio tras desplegar, asi que solo se comprueba la
          # forma: la etapa 3 no puede verificarse gastando credito.
          url="https://${FLY_APP}.fly.dev/v1/uso?n=5"
          codigo="$(curl -s -o /tmp/uso.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" "${url}" || true)"
          echo "HTTP ${codigo}"
          if [ "${codigo}" != "200" ]; then
            echo "::error::/v1/uso respondio ${codigo}."
            cat /tmp/uso.json || true
            exit 1
          fi
          if ! jq -e '.object == "list" and (.data | type == "array") and (.total | type == "number")' /tmp/uso.json > /dev/null; then
            echo "::error::/v1/uso no devolvio la lista esperada."
            cat /tmp/uso.json || true
            exit 1
          fi
          echo "OK: registro de uso con $(jq -r '.total' /tmp/uso.json) llamadas"

      - name: Verificar /v1/apps
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SERVICIO_CLAVE: ${{ secrets.SERVICIO_CLAVE }}
        run: |
          if [ -z "${SERVICIO_CLAVE}" ]; then
            echo "Sin clave de servicio: no se comprueba /v1/apps."
            exit 0
          fi
          # Solo se lee: dar de alta una aplicacion desde el despliegue dejaria
          # claves sueltas en produccion.
          url="https://${FLY_APP}.fly.dev/v1/apps"
          codigo="$(curl -s -o /tmp/apps.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" "${url}" || true)"
          echo "HTTP ${codigo}"
          if [ "${codigo}" != "200" ] || ! jq -e '.object == "list" and (.data | type == "array")' /tmp/apps.json > /dev/null; then
            echo "::error::/v1/apps no respondio la lista esperada (HTTP ${codigo})."
            cat /tmp/apps.json || true
            exit 1
          fi
          # Y ninguna clave puede salir de aqui, ni siquiera su hash.
          if jq -e '[.data[] | keys] | flatten | map(select(. == "clave" or . == "hash")) | length > 0' /tmp/apps.json > /dev/null; then
            echo "::error::/v1/apps devolvio claves o hashes; eso no puede salir del servicio."
            exit 1
          fi
          echo "OK: $(jq -r '.total' /tmp/apps.json) aplicaciones, sin claves en la respuesta"

      - name: Verificar /v1/presupuesto
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SERVICIO_CLAVE: ${{ secrets.SERVICIO_CLAVE }}
        run: |
          if [ -z "${SERVICIO_CLAVE}" ]; then
            echo "Sin clave de servicio: no se comprueba /v1/presupuesto."
            exit 0
          fi
          # La administracion no tiene topes, y eso es justo lo que se comprueba:
          # que nadie pueda encerrar fuera de casa al dueño del servicio.
          url="https://${FLY_APP}.fly.dev/v1/presupuesto"
          codigo="$(curl -s -o /tmp/presupuesto.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" "${url}" || true)"
          echo "HTTP ${codigo}"
          if [ "${codigo}" != "200" ] || ! jq -e '.administracion == true' /tmp/presupuesto.json > /dev/null; then
            echo "::error::/v1/presupuesto no reconocio la clave de administracion (HTTP ${codigo})."
            cat /tmp/presupuesto.json || true
            exit 1
          fi
          echo "OK: la administracion sigue sin limites"

      - name: Verificar los alias
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SERVICIO_CLAVE: ${{ secrets.SERVICIO_CLAVE }}
        run: |
          if [ -z "${SERVICIO_CLAVE}" ]; then
            echo "Sin clave de servicio: no se comprueban los alias."
            exit 0
          fi
          base="https://${FLY_APP}.fly.dev"
          nombre="verificacion-despliegue"

          # Un alias de usar y tirar: se crea, se simula y se borra. Ninguna de
          # las tres cosas llama a OpenRouter, asi que no gasta credito.
          codigo="$(curl -s -o /tmp/alias.json -w '%{http_code}' --max-time 20 -X PUT \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" -H "Content-Type: application/json" \
            -d '{"modelo":"google/gemini-2.5-flash-lite","respaldos":["openai/gpt-5-mini"],"parametros":{"temperature":0.1},"nota":"lo crea y lo borra deploy.yml"}' \
            "${base}/v1/alias/${nombre}" || true)"
          echo "PUT /v1/alias/${nombre} -> HTTP ${codigo}"
          if [ "${codigo}" != "200" ]; then
            echo "::error::no se pudo guardar un alias (HTTP ${codigo})."
            cat /tmp/alias.json || true
            exit 1
          fi

          # La cadena tiene que salir resuelta y en orden: el principal primero.
          codigo="$(curl -s -o /tmp/simular.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" \
            "${base}/v1/alias/${nombre}/simular" || true)"
          if [ "${codigo}" != "200" ] || ! jq -e '
               (.cadena | length) == 2
               and .cadena[0].papel == "principal"
               and .cadena[1].papel == "respaldo"
               and .cadena[0].modelo == "google/gemini-2.5-flash-lite"' /tmp/simular.json > /dev/null; then
            echo "::error::la simulacion del alias no devolvio la cadena esperada (HTTP ${codigo})."
            cat /tmp/simular.json || true
            exit 1
          fi
          jq -r '"OK: cadena " + ([.cadena[].modelo] | join(" -> "))' /tmp/simular.json

          # Un alias que no existe es 404 con el sobre de siempre, no un 500.
          http="$(curl -s -o /tmp/alias404.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" \
            "${base}/v1/alias/no-existe-este/simular" || true)"
          if [ "${http}" != "404" ] || ! jq -e '.ok == false and .error.code == "alias_desconocido"' /tmp/alias404.json > /dev/null; then
            echo "::error::un alias desconocido respondio ${http} en vez de 404 alias_desconocido."
            cat /tmp/alias404.json || true
            exit 1
          fi

          codigo="$(curl -s -o /tmp/borrado.json -w '%{http_code}' --max-time 20 -X DELETE \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" "${base}/v1/alias/${nombre}" || true)"
          if [ "${codigo}" != "200" ]; then
            echo "::error::no se pudo borrar el alias de verificacion (HTTP ${codigo}); queda suelto en el servicio."
            cat /tmp/borrado.json || true
            exit 1
          fi
          echo "OK: alias creado, simulado y borrado"

      - name: Verificar el streaming
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SERVICIO_CLAVE: ${{ secrets.SERVICIO_CLAVE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${SERVICIO_CLAVE}" ] || [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Faltan secretos: no se comprueba el streaming."
            exit 0
          fi
          # Unico paso que gasta credito, y por eso pide un token: un flujo solo
          # se puede comprobar de verdad pidiendo uno. Sale por menos de una
          # millonesima de dolar con el modelo por defecto.
          url="https://${FLY_APP}.fly.dev/v1/chat/completions"
          codigo="$(curl -s -o /tmp/flujo.txt -D /tmp/flujo.cab -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Di hola."}],"max_tokens":8,"stream":true}' \
            "${url}" || true)"
          echo "HTTP ${codigo}"
          if [ "${codigo}" != "200" ]; then
            echo "::error::/v1/chat/completions con stream respondio ${codigo}."
            cat /tmp/flujo.txt || true
            exit 1
          fi
          if ! grep -qi '^content-type:.*text/event-stream' /tmp/flujo.cab; then
            echo "::error::la respuesta en flujo no vino como text/event-stream."
            cat /tmp/flujo.cab || true
            exit 1
          fi
          if ! grep -q '^data: ' /tmp/flujo.txt || ! grep -q '\[DONE\]' /tmp/flujo.txt; then
            echo "::error::el flujo no trajo eventos data: cerrados con [DONE]."
            head -20 /tmp/flujo.txt || true
            exit 1
          fi
          uso="$(grep -i '^x-uso-id:' /tmp/flujo.cab | tr -d '\r' | cut -d' ' -f2)"
          if [ -z "${uso}" ]; then
            echo "::error::el flujo no devolvio la cabecera X-Uso-Id."
            exit 1
          fi
          echo "OK: flujo servido, registro ${uso}"

          # El registro se escribe al cerrarse el flujo, no antes.
          sleep 5
          codigo="$(curl -s -o /tmp/flujo-uso.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${SERVICIO_CLAVE}" \
            "https://${FLY_APP}.fly.dev/v1/uso/${uso}" || true)"
          if [ "${codigo}" != "200" ] || ! jq -e '.primer_token_ms != null and .tokens_salida > 0' /tmp/flujo-uso.json > /dev/null; then
            echo "::error::el flujo no quedo medido (HTTP ${codigo})."
            cat /tmp/flujo-uso.json || true
            exit 1
          fi
          jq -r '"OK: " + (.tokens_salida|tostring) + " tokens de salida, primer token a los " + (.primer_token_ms|tostring) + " ms"' /tmp/flujo-uso.json

      - name: Verificar el formato de error
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          # Un solo sobre de error es contrato publicado: si cambia, el run falla.
          # Los dos casos se provocan sin clave y sin gastar credito.
          base="https://${FLY_APP}.fly.dev"

          comprueba() {
            ruta="$1"; esperado="$2"; codigo="$3"; tipo="$4"
            http="$(curl -s -o /tmp/error.json -w '%{http_code}' --max-time 20 "${base}${ruta}" || true)"
            echo "${ruta} -> HTTP ${http}"
            if [ "${http}" != "${esperado}" ]; then
              echo "::error::${ruta} respondio ${http} y se esperaba ${esperado}."
              cat /tmp/error.json || true
              return 1
            fi
            if ! jq -e --arg c "${codigo}" --arg t "${tipo}" \
                 '.ok == false and (.error.message | type == "string" and length > 0)
                  and .error.code == $c and .error.type == $t' /tmp/error.json > /dev/null; then
              echo "::error::${ruta} no devolvio el sobre de error esperado (code=${codigo}, type=${tipo})."
              cat /tmp/error.json || true
              return 1
            fi
            echo "OK: $(jq -r '.error.code + " / " + .error.type' /tmp/error.json)"
          }

          comprueba "/v1/models" 401 sin_clave authentication_error
          comprueba "/v1/ruta-que-no-existe" 404 ruta_desconocida not_found_error

      - name: Resumen del despliegue
        if: success() && steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          region="$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' app/fly.toml)"
          {
            echo "### Backend desplegado en Fly.io"
            echo ""
            echo "- App: \`${FLY_APP}\` (region \`${region}\`)"
            echo "- URL: https://${FLY_APP}.fly.dev/"
            echo "- Salud: https://${FLY_APP}.fly.dev/salud"
            echo "- Hola mundo: https://${FLY_APP}.fly.dev/holamundo"
            echo "- Estado del servicio: https://${FLY_APP}.fly.dev/v1/estado (requiere clave)"
            echo "- Catalogo: https://${FLY_APP}.fly.dev/v1/models (requiere clave)"
            echo "- Uso: https://${FLY_APP}.fly.dev/v1/uso (requiere clave)"
            echo "- Comprobacion desde Pages: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/holamundo.html"
            echo "- Consola: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/consola.html"
            echo "- Build (SHA): \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
